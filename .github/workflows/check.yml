# Every push and pull request: the gates a fresh clone can satisfy (make check-public), which are
# every script's self-tests, the publication allowlist, the server's doctor and the page structure
# checks. The full `make check` also verifies claims, runs the golden evals and checks generated
# pages for freshness. Those read captured evidence, including page text of City documents, that
# stays out of this repository, so they run in a maintainer's checkout. Pull-request jobs have no
# write token.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: make check-public
        run: make check-public
